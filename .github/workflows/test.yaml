name: Entrypoint tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Check entrypoint syntax
        run: bash -n entrypoint.sh
      - name: Run entrypoint tests
        run: bash tests/entrypoint_test.sh
      - name: Run action command-construction tests
        run: bash tests/action_test.sh
